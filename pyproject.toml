[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv_build]
package-data = { m365_gdap_runner = ["py.typed"] }

[project]
name = "m365-gdap-runner"
version = "0.1.0"
description = "Run Python scripts across GDAP customer tenants from a single partner sign-in."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "azure-auth",
    "httpx>=0.28.1,<1",
    "openpyxl>=3.1.5,<4",
    "platformdirs>=4.3,<5",
    "tomlkit>=0.13,<1",
]

[dependency-groups]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7.7,<10",  # GHSA-xvg9-69gf-fjrf
    "mkdocstrings[python]>=1.0.4,<2",
]
test = [
    "pytest>=9.0.3,<10",  # GHSA-6w46-j5rx-g56g
    "pytest-cov>=7.1,<8",
]
secrets = [
    "detect-secrets>=1.5,<2",
]
dev = [
    {include-group = "docs"},
    {include-group = "test"},
    {include-group = "secrets"},
    "debugpy>=1.8,<2",
    "mypy>=2.1,<3",
    "pre-commit>=4.6,<5",
    "ruff>=0.15,<1",
    "types-openpyxl>=3.1.5,<4",
    "vulture>=2.16,<3",
]

[tool.uv]
constraint-dependencies = [
    "cryptography>=50.0.0",  # GHSA-g6cj-pr64-35w5; prune when upstream requires it
    "virtualenv>=21.7.13",  # GHSA-p58f-9548-mpm2, GHSA-94p9-xgh2-xp45, GHSA-9h9j-4vrj-gf7g; prune when pre-commit requires it
    "pyjwt>=2.14.0",  # 26 advisories, e.g. GHSA-9j54-fg26-wv3r; prune when msal requires it
    "urllib3>=2.8.0",  # GHSA-8988-9cw3-xx77, GHSA-gh4c-6fx4-qh6g, GHSA-vxq7-64xx-v4gw; prune when requests requires it
]

[tool.uv.sources]
azure-auth = { git = "https://github.com/DrollRobot/azure-auth.git", tag = "v0.6.1" }

[project.scripts]
m365-gdap-runner = "m365_gdap_runner.cli:list_tenants"
m365-gdap-runner-config = "m365_gdap_runner.config.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--cov=m365_gdap_runner",
    "--cov=scripts",
    "--cov-report=term-missing",
    "--cov-fail-under=0", # goal: 90
    "--strict-markers",
    "--strict-config",
]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "unit: single function/class in isolation; all dependencies mocked or stubbed",
    "integration: multiple real components wired together across a boundary",
    "e2e: whole application end to end, driven like a real user",
    "smoke: fast 'is it fundamentally broken' check",
    "regression: guards against reintroduction of a previously fixed bug",
    "acceptance: verifies behavior against a requirement or user-facing spec",
    "functional: tests behavior/output of a feature without regard to internal structure",
    "live: requires a real external resource (network, live tenant, secrets, third-party API)",
    "destructive_local: mutates the host/device; guarded to prevent accidental execution",
    "destructive_remote: mutates a remote/external system; guarded to prevent accidental execution",
    "slow: long-running",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W = pycodestyle, D = pydocstyle, F = pyflakes, I = isort, B = bugbear,
# UP = pyupgrade, S = security (bandit), SIM = simplify, RUF = ruff-specific,
# PT = pytest style, ANN = annotations
select = ["E", "D", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT", "ANN"]
extend-ignore = ["ANN401"]  # Any in **kwargs is a legitimate pass-through annotation

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "S101"]  # no docstrings/annotations in tests; assert is fine

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts", "examples"]
mypy_path = ["scripts", "scripts/template_setup"]

# AGENTS: ONLY ADD OVERRIDES IF, AFTER RESEARCHING, THERE IS NO TYPES STUB AVAILABLE.
# [[tool.mypy.overrides]]
# module = [""]
# ignore_missing_imports = true

[tool.vulture]
# tests/ is left out on purpose: a test calling otherwise-unused code would
# count as a caller and hide it.
paths = ["src"]
min_confidence = 60
# Names used in ways vulture cannot see.
ignore_names = [
    "exchange",  # context.py: TenantContext clients, read by payloads
    "ipps",
    "arm",
]
