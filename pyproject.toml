[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv_build]
package-data = { m365_gdap_runner = ["py.typed"] }

[project]
name = "m365-gdap-runner"
version = "0.1.0"
description = "Run one Python payload across GDAP customer tenants from a single partner sign-in."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "azure-auth",
    "httpx>=0.28.1,<1",
    "platformdirs>=4.3,<5",
    "tomlkit>=0.13,<1",
]

[project.optional-dependencies]
# Credential-backend extras: each installs what one secret backend needs, so
# the end user picks a backend at install time (e.g. 'uv sync --extra keyring'
# or 'pip install <package>[keyvault]'). Contributors install all of them with
# 'uv sync --all-extras'. Delete an extra together with its backend module.
keyring = [
    "keyring>=25.0,<26",
]
keyvault = [
    "azure-identity>=1.25,<2",
    "azure-keyvault-secrets>=4.11,<5",
]

[dependency-groups]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7.7,<10",  # GHSA-xvg9-69gf-fjrf
    "mkdocstrings[python]>=1.0.4,<2",
]
test = [
    "pytest>=9.0.3,<10",  # GHSA-6w46-j5rx-g56g
    "pytest-cov>=7.1,<8",
]
dev = [
    {include-group = "docs"},
    {include-group = "test"},
    "debugpy>=1.8,<2",
    "detect-secrets>=1.5,<2",
    "mypy>=2.1,<3",
    "pre-commit>=4.6,<5",
    "ruff>=0.15,<1",
    #"other-project", # FIXME add any local/github dependencies here
]

[tool.uv]
constraint-dependencies = [
    "cryptography>=50.0.0",  # GHSA-g6cj-pr64-35w5; prune when upstream requires it
]

[tool.uv.sources]
# Pinned to a tag on purpose: azure-auth is pre-1.0 and still makes breaking changes.
azure-auth = { git = "https://github.com/DrollRobot/azure-auth.git", tag = "v0.3.0" }

[project.scripts]
m365-gdap-runner = "m365_gdap_runner.main:main"
m365-gdap-runner-config = "m365_gdap_runner.config.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--cov=m365_gdap_runner",
    "--cov=scripts",
    "--cov-report=term-missing",
    "--cov-fail-under=0", # FIXME: coverage disabled for template. update for your project.
    "--strict-markers",
    "--strict-config",
]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    # Scope
    "unit: single function/class in isolation; all dependencies mocked or stubbed",
    "integration: multiple real components wired together across a boundary",
    "e2e: whole application end to end, driven like a real user",
    # Purpose
    "smoke: fast 'is it fundamentally broken' check",
    "regression: guards against reintroduction of a previously fixed bug",
    "acceptance: verifies behavior against a requirement or user-facing spec",
    "functional: tests behavior/output of a feature without regard to internal structure",
    # Dependency
    "live: requires a real external resource (network, live tenant, secrets, third-party API)",
    "destructive_local: mutates the host/device; guarded to prevent accidental execution",
    "destructive_remote: mutates a remote/external system; guarded to prevent accidental execution",
    # Performance
    "slow: long-running",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# E/W = pycodestyle, D = pydocstyle, F = pyflakes, I = isort, B = bugbear,
# UP = pyupgrade, S = security (bandit), SIM = simplify, RUF = ruff-specific,
# PT = pytest style, ANN = annotations
select = ["E", "D", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT", "ANN"]
extend-ignore = ["ANN401"]  # Any in **kwargs is a legitimate pass-through annotation

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "S101"]  # no docstrings/annotations in tests; assert is fine

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "scripts", "examples"]
mypy_path = ["scripts", "scripts/template_setup"]

# AGENTS: ONLY ADD OVERRIDES IF, AFTER RESEARCHING, THERE IS NO TYPES STUB AVAILABLE.
