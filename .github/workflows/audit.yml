# .github/workflows/audit.yml

name: Security audit
run-name: Audit on ${{ github.ref_name }} ${{ github.event_name }} by @${{ github.actor }}

on:
  push:
    branches: ['**']  # '**' also matches names with a slash (feature/foo); tags excluded
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.11.x"

      - name: Sync dependencies
        run: uv sync --locked --all-groups --all-extras

      - name: Audit dependencies
        run: uv audit

  # Secret scanning.

  # detect-secrets runs at the version locked in uv.lock (the "secrets"
  # dependency group), so local pre-commit scans and CI use the same release.
  # Only that group is installed: no project, so no private deps or token.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.11.x"

      - name: Sync detect-secrets
        run: uv sync --locked --only-group secrets

      # --no-sync: a plain `uv run` would sync the whole project first.
      # Fails if any tracked file contains a detection that is not already
      # recorded in .secrets.baseline.
      - name: Scan tracked files for new secrets
        run: |
          git ls-files -z | xargs -0 -r \
            uv run --no-sync detect-secrets-hook --baseline .secrets.baseline

      # This blocks the two ways the baseline can be used to smuggle a secret
      # past the scan above:
      #   UNVERIFIED    -- entry added by `scan` that nobody reviewed
      #   VERIFIED_TRUE -- entry a human confirmed is a real secret
      - name: Require every baseline entry to be an audited false positive
        run: |
          uv run --no-sync detect-secrets audit --report .secrets.baseline > secrets-report.json
          python3 - <<'PY'
          import json
          import sys

          with open("secrets-report.json", encoding="utf-8") as handle:
              results = json.load(handle)["results"]

          unresolved = [r for r in results if r["category"] != "VERIFIED_FALSE"]
          for entry in unresolved:
              types = ", ".join(entry["types"])
              print(
                  f"::error file={entry['filename']}::{entry['category']}: {types}. "
                  "Audit it with `uv run detect-secrets audit .secrets.baseline` "
                  "and remove the secret if it is real."
              )

          if unresolved:
              sys.exit(1)

          print(f"{len(results)} baseline entries, all audited as false positives.")
          PY
